global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pentabell-server'
    static_configs:
      - targets: ['192.168.33.10:4000']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      format: ['prometheus']

  - job_name: 'pentabell-client'
    static_configs:
      - targets: ['192.168.33.10:3000']
    metrics_path: '/'
    scrape_interval: 60s
    scrape_timeout: 15s
    params:
      format: ['prometheus']

  - job_name: 'pentabell-grafana'
    static_configs:
      - targets: ['192.168.33.10:3001']
    metrics_path: '/api/health'
    scrape_interval: 30s
    scrape_timeout: 10s
    params:
      format: ['prometheus']