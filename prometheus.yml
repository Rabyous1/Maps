global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['192.168.33.10:9091']

  - job_name: 'pentabell-server'
    static_configs:
      - targets: ['192.168.33.10:4000']

  - job_name: 'pentabell-client'
    static_configs:
      - targets: ['192.168.33.10:3000']

  - job_name: 'pentabell-grafana'
    static_configs:
      - targets: ['192.168.33.10:3001']

  - job_name: 'pentabell-postgres'
    static_configs:
      - targets: ['192.168.33.10:5432']