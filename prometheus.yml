global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pentabell-server'
    static_configs:
      - targets: ['192.168.33.10:4000']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_protocols: ['PrometheusText0.0.4']
    honor_labels: true

  - job_name: 'pentabell-client'
    static_configs:
      - targets: ['192.168.33.10:3000']
    metrics_path: '/login'
    scrape_interval: 30s
    scrape_protocols: ['PrometheusText0.0.4']
    honor_labels: true

  - job_name: 'pentabell-grafana'
    static_configs:
      - targets: ['192.168.33.10:3001']
    metrics_path: '/api/health'
    scrape_interval: 30s
    scrape_protocols: ['PrometheusText0.0.4']
    honor_labels: true

  - job_name: 'pentabell-nexus'
    static_configs:
      - targets: ['192.168.33.10:8081']
    metrics_path: '/service/metrics/prometheus'
    scrape_interval: 30s
    scrape_protocols: ['PrometheusText0.0.4']
    honor_labels: true

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.33.10:9100']
    metrics_path: '/metrics'