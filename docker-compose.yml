version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: pentabell-postgres
    environment:
      POSTGRES_DB: maps
      POSTGRES_USER: maps
      POSTGRES_PASSWORD: maps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pentabell-network
    restart: unless-stopped

  # Serveur Backend (API)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pentabell-server
    environment:
      NODE_ENV: production
      APP_PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: maps
      DB_USER: maps
      DB_PASSWORD: maps
      ACCESS_TOKEN_PRIVATE_KEY: 261f7b964552d435d16a7c21ea928d8b25b7fc456125d8a30ece68fba6412f08
      REFRESH_TOKEN_PRIVATE_KEY: cf4bfbf315106364e09a0e0b401b019cd06774fc09db35edb65209d85ab115a0
      SESSION_SECRET: 3a7f8b1c4d9e2f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9
      ALLOWED_IPS: http://localhost:3000,http://client:3000,http://192.168.33.10:3000,https://*.ngrok.io
      CORS_DOMAIN: http://localhost:3000,http://192.168.33.10:3000,https://*.ngrok.io
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: khedmapfe@gmail.com
      SMTP_PASSWORD: 'zshl gnnj pmix wtjd'
      ACCESS_TOKEN_TIME: 1h
      REFRESH_TOKEN_TIME: 9h
      RESET_PASSWORD_TOKEN_PRIVATE_KEY: 9e16eb3a2012666b82533d3d51f4bf4ca7f87e3a822711b2e1f9698f2e15d74d
      RESET_PASSWORD_TIME: 10m
      API_KEY: CHANGE_ME
      RESET_PASSWORD_URL_FRONT: http://192.168.33.10:3000/reset-password
      CONFIRM_ACCOUNT_URL_FRONT: http://192.168.33.10:3000/confirm-account
      LOGIN_URL_FRONT: http://192.168.33.10:4000/api/v1/auth/login
      MICROSOFT_AUTH_ACTIVATION_FRONTEND_URL: http://192.168.33.10:3000/complete-profile
      FRONTEND_LOGIN_URL: http://192.168.33.10:3000/login
      COOKIE_MAX_AGE: 43200000
      GOOGLE_CLIENT_ID: 682080940030-p59p8cve8kahiqigrg5ddm06v8hkikuu.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_REDIRECT_URI: http://192.168.33.10:4000/api/v1/auth/google/callback
      MICROSOFT_CLIENT_ID: 80562304-3209-4cba-a847-398bd4ed5f21
      MICROSOFT_CLIENT_SECRET: U3H8Q~qgMXtNHr9BJebt4STz2kzgDN60-ljaTbvc
      MICROSOFT_TENANT_ID: e128bc05-adf3-475c-9a8b-8c9ae9ccb32a
      MICROSOFT_AUTHORIZATION_URL: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      MICROSOFT_TOKEN_URL: https://login.microsoftonline.com/common/oauth2/v2.0/token
      MICROSOFT_ENTRY_POINT: https://graph.microsoft.com
      MICROSOFT_REDIRECT_URI: http://192.168.33.10:4000/api/v1/auth/callback
      LINKEDIN_CLIENT_ID: 77lcsq87zs482b
      LINKEDIN_CLIENT_SECRET: WPL_AP1.w9cb6MK8qp1NytAp.My7HBg==
      LINKEDIN_REDIRECT_URI: http://192.168.33.10:4000/api/v1/auth/linkedin/callback
      LINKEDIN_USERINFO_URL: https://api.linkedin.com/v2/userinfo
      SESSION_RESAVE: "false"
      SESSION_SAVE_UNINITIALIZED: "false"
      COOKIE_SECURE: "false"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: lax
      MAX_ATTACHMENTS_UPLOAD: 5
      SYSTEM_USER_ID: 00000000-0000-0000-0000-000000000000
    ports:
      - "4000:4000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - pentabell-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Client Frontend (React)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pentabell-client
    environment:
      REACT_APP_API_URL: http://192.168.33.10:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - pentabell-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana
    container_name: pentabell-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    networks:
      - pentabell-network
      

  # Prometheus
  prometheus:
    image: prom/prometheus
    container_name: pentabell-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    networks:
      - pentabell-network

  # Ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: pentabell-ngrok
    restart: on-failure:3
    network_mode: host
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  pentabell-network:
    driver: bridge
